;; Modules - Dotfiles style

[module/arch]
type = custom/text
format = <label>
label = 󰣇
label-foreground = ${color.primary}
format-padding = 0
click-left = rofi -show drun -modi drun &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sep]
type = custom/text
format = <label>
label = 
label-foreground = ${color.disabled}
format-padding = 0
format-margin = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true

icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-default = •

format = <label-state>

label-active = %icon%
label-active-foreground = ${color.white}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${color.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${color.disabled}
label-empty-padding = 1

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/date]
type = internal/date
date = %I:%M %p
date-alt = %a, %d %b %Y
interval = 30
format = <label>
label = %date%
label-foreground = ${color.foreground}
click-left = polybar-msg cmd toggle-date &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 30
label = %output%
label-foreground = ${color.foreground}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/audio]
type = internal/pulseaudio
interval = 5
use-ui-max = false

format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${color.foreground}

format-muted = <label-muted>
label-muted = 󰝟 Muted
label-muted-foreground = ${color.disabled}

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = ~/.config/polybar/scripts/volume.sh up 5
scroll-down = ~/.config/polybar/scripts/volume.sh down 5

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/recording]
type = custom/script
exec = ~/.config/polybar/scripts/recording.sh
interval = 2
label = %output%
click-left = ~/.config/rofi/scripts/capture.sh &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates-check.sh
interval = 600
label = %output%
label-foreground = ${color.secondary}
format = <label>
format-offline = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/clipboard]
type = custom/text
format = <label>
label = 󰅊
label-foreground = ${color.foreground}
click-left = ~/.config/polybar/scripts/clipboard.sh choose &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
