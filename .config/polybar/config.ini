;; Polybar Config - Dotfiles Style

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[global/wm]
margin-bottom = 0
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
override-redirect = false
bottom = true
fixed-center = true

width = 100%
height = 18pt
offset-x = 0%
offset-y = 0%

background = ${color.background}
foreground = ${color.foreground}

radius = 0

line-size = 3pt
line-color = ${color.background}

border-size = 0pt
border-top-size = 1pt
border-color = ${color.subtle}

padding = 1
padding-left = 2
padding-right = 2

module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=9;2"
font-1 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = arch sep workspaces
modules-center = date
modules-right = updates clipboard recording network audio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[settings]
screenchange-reload = true
pseudo-transparency = true
