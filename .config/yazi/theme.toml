# Yazi Theme - Dotfiles Palette
# bg=#191c20 bg_alt=#242f3d fg=#a6b5c4 border=#4d617a

[status]
separator = " │ "

[status.normal]
main = { fg = "#191c20", bg = "#a6b5c4", bold = true }
permissions = { fg = "#4d617a", bg = "#242f3d" }
size = { fg = "#a6b5c4", bg = "#242f3d" }
name = { fg = "#a6b5c4", bg = "#242f3d" }

[status.select]
main = { fg = "#191c20", bg = "#e53935", bold = true }
permissions = { fg = "#4d617a", bg = "#242f3d" }
size = { fg = "#a6b5c4", bg = "#242f3d" }
name = { fg = "#a6b5c4", bg = "#242f3d" }

[status.preview]
main = { fg = "#191c20", bg = "#5a6f8a", bold = true }
permissions = { fg = "#4d617a", bg = "#242f3d" }
size = { fg = "#a6b5c4", bg = "#242f3d" }
name = { fg = "#a6b5c4", bg = "#242f3d" }

