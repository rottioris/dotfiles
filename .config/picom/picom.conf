#################################
# Backend
#################################
backend = "glx";
vsync = true;

#################################
# Transparency
#################################
active-opacity = 1.0;
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-dim = 0.0;
detect-client-opacity = true;

#################################
# Fading Animations (disabled for performance)
#################################
fading = false;
# fade-delta = 5;
# fade-in-step = 0.03;
# fade-out-step = 0.03;
no-fading-openclose = true;

#################################
# Shadows (subtle)
#################################
shadow = true;
shadow-radius = 8;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.25;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "class_g = 'slop'",
  "class_g = 'i3-frame'",
  "focused = true",
];

#################################
# Blur (minimal for performance)
#################################
blur-method = "dual_kawase";
blur-strength = 2;
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

#################################
# Opacity of specific windows
#################################
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "93:class_g = 'Zathura'"
];

#################################
# Animations (disabled for performance)
#################################
animations = false;
# animation-stiffness = 300.0;
# animation-dampening = 22.0;
# animation-clamping = true;
# animation-for-open-window = "zoom";
# animation-for-menu-window = "slide-down";
# animation-for-transient-window = "slide-down";

#################################
# Misc
#################################
detect-rounded-corners = true;
unredir-if-possible = true;
use-damage = true;